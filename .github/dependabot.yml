version: 2
updates:
  - package-ecosystem: pip
    directory: /agents/core
    schedule:
      interval: weekly
      day: monday
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
    # Python 3.11 remains in CI and cannot install these release lines.
    ignore:
      - dependency-name: numpy
        versions: [">=2.5.0"]
      - dependency-name: xgboost
        versions: [">=3.3.0"]
      - dependency-name: scipy
        versions: [">=1.18.0"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /web/api
    schedule:
      interval: weekly
      day: monday
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /hf_space
    schedule:
      interval: weekly
      day: monday
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /pilot/analysis
    schedule:
      interval: weekly
      day: monday
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
    ignore:
      - dependency-name: numpy
        versions: [">=2.5.0"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-updates:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /hf_space
    schedule:
      interval: weekly
      day: monday
