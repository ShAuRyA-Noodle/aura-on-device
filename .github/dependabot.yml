version: 2
# Version updates share one PR per directory for minor and patch releases.
# Major updates and security updates stay separate for focused review.
updates:
  - package-ecosystem: pip
    directory: /agents/core
    schedule:
      interval: weekly
      day: monday
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    # Python 3.11 remains in CI and cannot install these release lines.
    ignore:
      - dependency-name: numpy
        versions: [">=2.5.0"]
      - dependency-name: xgboost
        versions: [">=3.3.0"]
      - dependency-name: scipy
        versions: [">=1.18.0"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /web/api
    schedule:
      interval: weekly
      day: monday
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /hf_space
    schedule:
      interval: weekly
      day: monday
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /pilot/analysis
    schedule:
      interval: weekly
      day: monday
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: numpy
        versions: [">=2.5.0"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /hf_space
    schedule:
      interval: weekly
      day: monday
